name: CI

on:
    push:
    pull_request:

permissions:
    contents: read
    actions: write

jobs:
    check:
        name: Controlli
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  # Nessun engines in package.json. Node 24 è la LTS attiva e
                  # soddisfa Vite (^20.19.0 || >=22.12.0).
                  node-version: 24
                  cache: npm

            - name: Installa le dipendenze
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Copertura effetti
              run: npm run cards:coverage

            - name: Installa Chromium
              run: npx playwright install --with-deps chromium

            - name: Test end-to-end
              id: e2e
              run: npm run test:e2e -- --reporter=line,html

            - name: Carica il report Playwright
              if: failure() && steps.e2e.outcome == 'failure'
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  if-no-files-found: ignore
